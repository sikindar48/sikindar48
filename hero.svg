<div align="center">

<svg
  width="100%"
  height="220"
  viewBox="0 0 1200 220"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14">
        <animate
          attributeName="stop-color"
          values="#080B14;#111827;#0B1324;#080B14"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#172554">
        <animate
          attributeName="stop-color"
          values="#172554;#312E81;#164E63;#172554"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#0F172A">
        <animate
          attributeName="stop-color"
          values="#0F172A;#134E4A;#1E1B4B;#0F172A"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <!-- Grid -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.045"
      />
    </pattern>

  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="220"
    rx="18"
    fill="url(#bg)"
  />

  <!-- Moving glow 1 -->
  <circle
    cx="180"
    cy="80"
    r="75"
    fill="#6366F1"
    opacity="0.20"
    filter="url(#blur)"
  >
    <animate
      attributeName="cx"
      values="180;360;180"
      dur="7s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="cy"
      values="80;145;80"
      dur="6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.12;0.25;0.12"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Moving glow 2 -->
  <circle
    cx="950"
    cy="150"
    r="85"
    fill="#06B6D4"
    opacity="0.18"
    filter="url(#blur)"
  >
    <animate
      attributeName="cx"
      values="950;780;950"
      dur="8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="cy"
      values="150;70;150"
      dur="7s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.10;0.24;0.10"
      dur="6s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Moving glow 3 -->
  <circle
    cx="600"
    cy="20"
    r="55"
    fill="#A78BFA"
    opacity="0.12"
    filter="url(#blur)"
  >
    <animate
      attributeName="cx"
      values="600;720;600"
      dur="9s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="cy"
      values="20;100;20"
      dur="8s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Subtle grid -->
  <rect
    width="1200"
    height="220"
    rx="18"
    fill="url(#grid)"
  />

  <!-- Decorative animated line -->
  <path
    d="M0 180 C200 130 320 210 520 165 S850 110 1200 165"
    fill="none"
    stroke="#67E8F9"
    stroke-opacity="0.12"
    stroke-width="1"
  >
    <animate
      attributeName="stroke-opacity"
      values="0.05;0.20;0.05"
      dur="4s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Name -->
  <text
    x="600"
    y="82"
    text-anchor="middle"
    fill="#F8FAFC"
    font-family="Inter, Arial, sans-serif"
    font-size="40"
    font-weight="700"
    letter-spacing="1"
  >
    NAYAB SIKINDAR SHAIK
  </text>

  <!-- Role -->
  <text
    x="600"
    y="120"
    text-anchor="middle"
    fill="#C4B5FD"
    font-family="Inter, Arial, sans-serif"
    font-size="16"
    font-weight="500"
    letter-spacing="2"
  >
    SOFTWARE ENGINEER · UI/UX DESIGNER · PRODUCT BUILDER
  </text>

  <!-- Animated accent -->
  <circle
    cx="600"
    cy="150"
    r="3"
    fill="#67E8F9"
  >
    <animate
      attributeName="r"
      values="2;5;2"
      dur="2s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.4;1;0.4"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

</svg>

</div>

